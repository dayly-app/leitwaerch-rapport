<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitwärch Schläpfer – Stundenrapport</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<style>
  :root{
    --navy-900:#0a1628;
    --navy-800:#0f2038;
    --navy-700:#16304f;
    --navy-600:#1e3f66;
    --accent:#e8a33d;
    --accent-soft:#f0c07a;
    --text:#eef2f7;
    --text-dim:#9fb0c3;
    --border:#22385a;
    --danger:#d9534f;
    --ok:#4caf82;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--navy-900),var(--navy-800));
    color:var(--text);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:22px 16px 14px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  header img{
    height:96px;
    margin-bottom:6px;
  }
  header .sub{
    color:var(--accent-soft);
    font-size:0.85rem;
    margin-top:2px;
  }
  .container{
    max-width:680px;
    margin:0 auto;
    padding:16px;
  }
  .card{
    background:var(--navy-700);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    margin:0 0 12px;
    font-size:1rem;
    color:var(--accent-soft);
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card h2 .toggle{
    font-size:0.75rem;
    color:var(--text-dim);
    cursor:pointer;
    font-weight:400;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .grid .full{grid-column:1/-1;}
  label{
    display:block;
    font-size:0.75rem;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  input, select, textarea{
    width:100%;
    padding:9px 10px;
    background:var(--navy-800);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-size:0.95rem;
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .field{margin-bottom:10px;}
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-size:0.9rem;
    font-weight:600;
    padding:11px 16px;
    font-family:inherit;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--navy-900);
    width:100%;
    margin-top:6px;
  }
  .btn-primary:active{background:var(--accent-soft);}
  .btn-secondary{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .row-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .row-actions button{flex:1;}
  .summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .summary select{width:auto;}
  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .total-hours{
    font-size:1.5rem;
    font-weight:700;
    color:var(--accent);
  }
  .total-sub{
    font-size:0.8rem;
    color:var(--text-dim);
    margin-top:2px;
  }
  .total-label{
    font-size:0.75rem;
    color:var(--text-dim);
  }
  .entry{
    background:var(--navy-800);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .entry-date{
    font-weight:600;
    font-size:0.95rem;
  }
  .entry-hours{
    color:var(--accent);
    font-weight:700;
  }
  .entry-objekt{
    display:inline-block;
    background:var(--navy-600);
    color:var(--accent-soft);
    font-size:0.75rem;
    padding:2px 8px;
    border-radius:12px;
    margin-top:6px;
  }
  .entry-meta{
    color:var(--text-dim);
    font-size:0.8rem;
    margin-top:6px;
  }
  .entry-note{
    font-size:0.85rem;
    margin-top:6px;
    color:var(--text);
  }
  .entry-buttons{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .entry-buttons button{
    flex:1;
    padding:7px;
    font-size:0.8rem;
  }
  .btn-edit{background:var(--navy-600);color:var(--text);}
  .btn-delete{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .empty{
    text-align:center;
    color:var(--text-dim);
    padding:30px 10px;
    font-size:0.9rem;
  }
  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .toolbar button{flex:1;}
  .month-group-label{
    color:var(--text-dim);
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:18px 0 8px;
  }
  .month-group-label:first-child{margin-top:0;}
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy-600);
    color:var(--text);
    padding:10px 18px;
    border-radius:20px;
    font-size:0.85rem;
    border:1px solid var(--border);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:50;
    max-width:85%;
    text-align:center;
  }
  .toast.show{opacity:1;}
  .status-dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--ok);
    margin-right:6px;
  }
  .storage-status{
    text-align:center;
    font-size:0.7rem;
    color:var(--text-dim);
    margin-top:6px;
  }
  .objekt-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--navy-800);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:8px;
    font-size:0.9rem;
  }
  .objekt-row .om-name{font-weight:600;}
  .objekt-row .om-rate{color:var(--text-dim); font-size:0.8rem;}
  .objekt-row .om-actions{display:flex; gap:6px;}
  .objekt-row .om-actions button{
    padding:5px 9px;
    font-size:0.75rem;
  }
  .hidden{display:none;}
  .collapsed .body-content{display:none;}
  .rate-hint{
    font-size:0.7rem;
    color:var(--text-dim);
    margin-top:2px;
  }
  .date-range{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
  }
</style>
</head>

<div class="container">

  <!-- CLOUD SYNC -->
  <div class="card" id="sync-card">
    <h2>Cloud-Sync (Handy ↔ PC)</h2>
    <div class="rate-hint" id="sync-status" style="margin-bottom:10px;">Nicht verbunden – Daten nur lokal auf diesem Gerät</div>
    <button class="btn-primary" onclick="createSyncCode()">Neuen Sync-Code erstellen</button>
    <div class="grid" style="margin-top:10px;">
      <div class="field full">
        <label>Bestehenden Code eingeben</label>
        <input type="text" id="sync-code-input" placeholder="z.B. LWS-7K2M-9XQP" style="text-transform:uppercase;">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn-secondary" onclick="joinSyncCode()">Verbinden</button>
      <button class="btn-secondary" onclick="disconnectSync()">Trennen</button>
    </div>
  </div>

  <!-- KUNDENVERWALTUNG -->
  <div class="card" id="kunde-card">
    <h2>Kunden <span class="toggle" onclick="toggleCard('kunde-card','kunde-toggle')" id="kunde-toggle">ausblenden</span></h2>
    <div class="body-content" id="kunde-body">
      <div id="kunde-list"></div>
      <div class="field" style="margin-top:10px;">
        <label>Neuer Kunde</label>
        <input type="text" id="new-kunde-name" placeholder="z.B. EV Schänis">
      </div>
      <div class="field">
        <label>Adresse</label>
        <textarea id="new-kunde-address" placeholder="Strasse Nr.&#10;PLZ Ort"></textarea>
      </div>
      <button class="btn-secondary" style="width:100%" onclick="addKunde()">+ Kunde hinzufügen</button>
    </div>
  </div>

  <!-- OBJEKTVERWALTUNG -->
  <div class="card" id="objekt-card">
    <h2>Objekte <span class="toggle" onclick="toggleCard('objekt-card','objekt-toggle')" id="objekt-toggle">ausblenden</span></h2>
    <div class="body-content" id="objekt-body">
      <div id="objekt-list"></div>
      <div class="grid" style="margin-top:10px;">
        <div class="field">
          <label>Kunde</label>
          <select id="new-objekt-kunde"></select>
        </div>
        <div class="field">
          <label>Neues Objekt</label>
          <input type="text" id="new-objekt-name" placeholder="z.B. Neubau Müller, Näfels">
        </div>
        <div class="field full">
          <label>Standard-Stundenansatz (CHF)</label>
          <input type="number" id="new-objekt-rate" min="0" step="0.5" placeholder="85">
        </div>
      </div>
      <button class="btn-secondary" style="width:100%" onclick="addObjekt()">+ Objekt hinzufügen</button>
    </div>
  </div>

  <!-- ERFASSUNG -->
  <div class="card">
    <h2 id="form-title">Neuer Eintrag</h2>
    <input type="hidden" id="edit-id">
    <div class="grid">
      <div class="field">
        <label>Datum</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Objekt</label>
        <select id="f-objekt" onchange="onObjektChange()"></select>
      </div>
      <div class="field full">
        <label>Ausgeführte Arbeit</label>
        <textarea id="f-arbeit" placeholder="z.B. Ausführung UG gezeichnet"></textarea>
      </div>
      <div class="field">
        <label>Von</label>
        <input type="time" id="f-start" onchange="recalcPreview()">
      </div>
      <div class="field">
        <label>Bis</label>
        <input type="time" id="f-end" onchange="recalcPreview()">
      </div>
      <div class="field">
        <label>Pause (Min.)</label>
        <input type="number" id="f-pause" value="0" min="0" step="5" onchange="recalcPreview()">
      </div>
      <div class="field">
        <label>oder direkt Stunden</label>
        <input type="number" id="f-hours-manual" min="0" step="0.25" placeholder="z.B. 5.5">
      </div>
      <div class="field">
        <label>Stundenansatz (CHF)</label>
        <input type="number" id="f-rate" min="0" step="0.5">
        <div class="rate-hint" id="rate-hint"></div>
      </div>
      <div class="field">
        <label>Vorschau Stunden</label>
        <input type="text" id="hours-preview" readonly style="opacity:0.8">
      </div>
    </div>
    <button class="btn-primary" id="save-btn" onclick="saveEntry()">Eintrag speichern</button>
    <div class="row-actions" id="cancel-row" style="display:none;">
      <button class="btn-secondary" onclick="cancelEdit()">Abbrechen</button>
    </div>
  </div>

  <!-- LISTE -->
  <div class="card">
    <div class="summary">
      <div>
        <div class="total-label" id="summary-label">Total diesen Monat</div>
        <div class="total-hours" id="total-hours">0.0 h</div>
        <div class="total-sub" id="total-betrag"></div>
      </div>
      <div class="filters">
        <select id="kunde-filter" onchange="onKundeFilterChange()"></select>
        <select id="objekt-filter" onchange="renderEntries()"></select>
        <select id="month-filter" onchange="renderEntries()"></select>
      </div>
    </div>
    <div id="entries-list"></div>
  </div>

  <!-- PDF RAPPORT -->
  <div class="card">
    <h2>Rapport als PDF</h2>
    <div class="field">
      <label>Kunde (für Adresse im PDF-Kopf)</label>
      <select id="pdf-kunde" onchange="onPdfKundeChange()"></select>
    </div>
    <div class="date-range">
      <div class="field">
        <label>Von</label>
        <input type="date" id="pdf-von">
      </div>
      <div class="field">
        <label>Bis</label>
        <input type="date" id="pdf-bis">
      </div>
    </div>
    <div class="row-actions" style="margin-top:0;">
      <button class="btn-secondary" onclick="setPdfRangeThisWeek()">Diese Woche</button>
      <button class="btn-secondary" onclick="setPdfRangeLastWeek()">Letzte Woche</button>
    </div>
    <button class="btn-primary" onclick="generatePDF()">PDF erstellen</button>
    <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="exportCSV()">CSV exportieren</button>
  </div>

  <div class="storage-status"><span class="status-dot"></span>Lokal auf diesem Gerät gespeichert</div>
</div>

const firebaseConfig = {
  apiKey: "AIzaSyDdAFsgjdB_YTcbnAxT325oeA_Pfh3ERNM",
  authDomain: "leitwaerch-stundenrapport.firebaseapp.com",
  databaseURL: "https://leitwaerch-stundenrapport-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "leitwaerch-stundenrapport",
  storageBucket: "leitwaerch-stundenrapport.firebasestorage.app",
  messagingSenderId: "367571826440",
  appId: "1:367571826440:web:058c4b9607abd1a9d79ebd"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

let syncCode = null;
let fbUnsub = null;

function generateSyncCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function seg(n){ let s=''; for(let i=0;i<n;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
  return 'LWS-' + seg(4) + '-' + seg(4);
}

function renderSyncStatus(){
  const el = document.getElementById('sync-status');
  if(syncCode){
    el.innerHTML = 'Verbunden mit Code: <strong>' + escapeHtml(syncCode) + '</strong>';
  }else{
    el.textContent = 'Nicht verbunden – Daten nur lokal auf diesem Gerät';
  }
}

async function pushStateToCloud(){
  if(!syncCode) return;
  try{
    await fbDb.ref('rapporte/' + syncCode).set({ kunden, objekte, entries, updatedAt: Date.now() });
  }catch(e){ showToast('Cloud-Speichern fehlgeschlagen'); }
}

function subscribeSync(code, isJoin){
  if(fbUnsub) fbUnsub();
  const r = fbDb.ref('rapporte/' + code);
  const handler = (snapshot)=>{
    const val = snapshot.val();
    if(val){
      kunden = val.kunden || [];
      objekte = val.objekte || [];
      entries = val.entries || [];
      localStorage.setItem('rapport:kunden', JSON.stringify(kunden));
      localStorage.setItem('rapport:objekte', JSON.stringify(objekte));
      localStorage.setItem('rapport:entries', JSON.stringify(entries));
      renderKundenList(); renderKundenSelects(); renderObjektList(); renderObjektSelects(); renderEntries();
    }else if(isJoin){
      showToast('Kein Code gefunden – Schreibweise prüfen');
    }
  };
  r.on('value', handler);
  fbUnsub = ()=> r.off('value', handler);
  renderSyncStatus();
}

async function createSyncCode(){
  const code = generateSyncCode();
  syncCode = code;
  localStorage.setItem('rapport:synccode', code);
  await pushStateToCloud();
  subscribeSync(code);
  showToast('Sync-Code erstellt: ' + code);
}

function joinSyncCode(){
  const input = document.getElementById('sync-code-input').value.trim().toUpperCase();
  if(!input){ showToast('Bitte Code eingeben'); return; }
  const hasLocalData = kunden.length || objekte.length || entries.length;
  if(hasLocalData && !confirm('Lokale Daten auf diesem Gerät werden durch die Cloud-Daten dieses Codes ersetzt. Fortfahren?')) return;
  syncCode = input;
  localStorage.setItem('rapport:synccode', input);
  subscribeSync(input, true);
}

function disconnectSync(){
  if(fbUnsub) fbUnsub();
  fbUnsub = null;
  syncCode = null;
  localStorage.removeItem('rapport:synccode');
  renderSyncStatus();
  showToast('Cloud-Sync getrennt (Daten bleiben lokal)');
}

let kunden = [];
let objekte = [];
let entries = [];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function toggleCard(cardId, toggleId){
  const card = document.getElementById(cardId);
  const toggle = document.getElementById(toggleId);
  card.classList.toggle('collapsed');
  toggle.textContent = card.classList.contains('collapsed') ? 'anzeigen' : 'ausblenden';
}

function calcHours(start, end, pauseMin){
  if(!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  mins -= Number(pauseMin||0);
  return Math.max(0, mins/60);
}

async function saveEntry(){
  const date = document.getElementById('f-date').value;
  const objektId = document.getElementById('f-objekt').value;
  const arbeit = document.getElementById('f-arbeit').value.trim();
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  const pause = document.getElementById('f-pause').value;
  const manual = document.getElementById('f-hours-manual').value;
  const rate = document.getElementById('f-rate').value;
  const editId = document.getElementById('edit-id').value;

  if(!date || !objektId){ showToast('Datum und Objekt sind Pflicht'); return; }
  if(!arbeit){ showToast('Bitte ausgeführte Arbeit eintragen'); return; }

  let hours;
  if(manual){ hours = Number(manual); }
  else { hours = calcHours(start, end, pause); }
  if(!hours || hours<=0){ showToast('Stunden fehlen oder 0 – Zeiten oder Stunden eintragen'); return; }

  const entry = {
    id: editId || uid(),
    date, objektId, arbeit,
    start: start||'', end: end||'',
    pause: Number(pause||0),
    hoursManual: manual ? Number(manual) : null,
    rate: rate ? Number(rate) : 0,
    hours
  };

  if(editId){
    const idx = entries.findIndex(e=>e.id===editId);
    if(idx>-1) entries[idx] = entry;
  }else{
    entries.push(entry);
  }

  await persistEntries();
  resetForm();
  renderEntries();
  showToast(editId ? 'Eintrag aktualisiert' : 'Eintrag gespeichert');
}

  return names[Number(m)-1] + ' ' + y;

function renderEntries(){
  populateMonthFilter();
  const monthFilter = document.getElementById('month-filter').value;
  const objektFilter = document.getElementById('objekt-filter').value;
  const kundeFilter = document.getElementById('kunde-filter').value;
  const list = document.getElementById('entries-list');

  let filtered = [...entries];
  if(monthFilter && monthFilter!=='all') filtered = filtered.filter(e=>monthKey(e.date)===monthFilter);
  if(kundeFilter && kundeFilter!=='all'){
    const objIds = objekte.filter(o=>o.kundeId===kundeFilter).map(o=>o.id);
    filtered = filtered.filter(e=>objIds.includes(e.objektId));
  }
  if(objektFilter && objektFilter!=='all') filtered = filtered.filter(e=>e.objektId===objektFilter);
  filtered.sort((a,b)=> b.date.localeCompare(a.date) || (b.start||'').localeCompare(a.start||''));

  document.getElementById('summary-label').textContent =
    (monthFilter==='all' ? 'Total alle Einträge' : 'Total ' + monthLabel(monthFilter));
  const totalH = filtered.reduce((s,e)=>s+e.hours,0);
  const totalCHF = filtered.reduce((s,e)=>s+(e.hours*(e.rate||0)),0);
  document.getElementById('total-hours').textContent = totalH.toFixed(2) + ' h';
  document.getElementById('total-betrag').textContent = totalCHF>0 ? ('CHF ' + totalCHF.toFixed(2)) : '';

  if(filtered.length===0){
    list.innerHTML = '<div class="empty">Keine Einträge für diese Auswahl.</div>';
    return;
  }

  let html = '';
  let lastMonth = null;
  filtered.forEach(e=>{
    const mk = monthKey(e.date);
    if(monthFilter==='all' && mk !== lastMonth){
      html += `<div class="month-group-label">${monthLabel(mk)}</div>`;
      lastMonth = mk;
    }
    const dateFmt = new Date(e.date+'T00:00:00').toLocaleDateString('de-CH', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'});
    const betrag = (e.hours*(e.rate||0));
    const zeit = e.hoursManual ? `${e.hours.toFixed(2)} h (manuell)` : `${e.start}–${e.end} · Pause ${e.pause} Min.`;
    html += `
      <div class="entry">
        <div class="entry-top">
          <div class="entry-date">${dateFmt}</div>
          <div class="entry-hours">${e.hours.toFixed(2)} h</div>
        </div>
        <span class="entry-objekt">${escapeHtml(objektName(e.objektId))} · ${escapeHtml(entryKundeName(e.objektId))}</span>
        <div class="entry-meta">${zeit} · CHF ${(e.rate||0).toFixed(2)}/h${e.rate ? ' · Betrag CHF '+betrag.toFixed(2) : ''}</div>
        <div class="entry-note">${escapeHtml(e.arbeit)}</div>
        <div class="entry-buttons">
          <button class="btn-edit" onclick="editEntry('${e.id}')">Bearbeiten</button>
          <button class="btn-delete" onclick="deleteEntry('${e.id}')">Löschen</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function setPdfRangeThisWeek(){
  const now = new Date();
  const day = (now.getDay()+6)%7; // Mo=0
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  document.getElementById('pdf-von').value = toISO(monday);
  document.getElementById('pdf-bis').value = toISO(sunday);
}
function setPdfRangeLastWeek(){
  const now = new Date();
  const day = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-day-7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  document.getElementById('pdf-von').value = toISO(monday);
  document.getElementById('pdf-bis').value = toISO(sunday);
}
function toISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function generatePDF(){
  const von = document.getElementById('pdf-von').value;
  const bis = document.getElementById('pdf-bis').value;
  const kundeFilterId = document.getElementById('pdf-kunde').value;
  if(!von || !bis){ showToast('Bitte Zeitraum wählen'); return; }

  let filtered = entries.filter(e=> e.date>=von && e.date<=bis);
  if(kundeFilterId && kundeFilterId!=='all'){
    const objIds = objekte.filter(o=>o.kundeId===kundeFilterId).map(o=>o.id);
    filtered = filtered.filter(e=>objIds.includes(e.objektId));
  }
  filtered.sort((a,b)=> a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
  if(filtered.length===0){ showToast('Keine Einträge für diese Auswahl'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageWidth = doc.internal.pageSize.getWidth();

  doc.addImage(LOGO_B64, 'PNG', 14, 12, 22, 22);
  doc.setFontSize(14);
  doc.setTextColor(20,30,45);
  doc.text('LEITWÄRCH SCHLÄPFER', 42, 20);
  doc.setFontSize(10);
  doc.setTextColor(90,100,115);
  doc.text('Stundenrapport', 42, 26);

  doc.setFontSize(10);
  doc.setTextColor(20,30,45);
  const vonFmt = new Date(von+'T00:00:00').toLocaleDateString('de-CH');
  const bisFmt = new Date(bis+'T00:00:00').toLocaleDateString('de-CH');
  doc.text(`Zeitraum: ${vonFmt} – ${bisFmt}`, pageWidth-14, 16, {align:'right'});

  let headerBottomY = 38;
  if(kundeFilterId && kundeFilterId!=='all'){
    const k = kunden.find(x=>x.id===kundeFilterId);
    if(k){
      doc.setFontSize(10);
      doc.setFont(undefined,'bold');
      doc.text(k.name, pageWidth-14, 22, {align:'right'});
      doc.setFont(undefined,'normal');
      const addrLines = (k.address||'').split(String.fromCharCode(10)).filter(Boolean);
      let ay = 27;
      addrLines.forEach(line=>{
        doc.text(line, pageWidth-14, ay, {align:'right'});
        ay += 4.5;
      });
      headerBottomY = Math.max(headerBottomY, ay + 4);
    }
  }

  const dayNames = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const rows = filtered.map(e=>{
    const d = new Date(e.date+'T00:00:00');
    const tag = dayNames[d.getDay()];
    const datum = d.toLocaleDateString('de-CH');
    const zeit = e.hoursManual ? '–' : `${e.start}–${e.end}`;
    const rate = e.rate||0;
    const betrag = e.hours*rate;
    return [
      tag, datum, objektName(e.objektId), e.arbeit, zeit,
      e.hours.toFixed(2), rate ? rate.toFixed(2) : '–', rate ? betrag.toFixed(2) : '–'
    ];
  });

  const totalHours = filtered.reduce((s,e)=>s+e.hours,0);
  const totalBetrag = filtered.reduce((s,e)=>s+(e.hours*(e.rate||0)),0);

  doc.autoTable({
    startY: headerBottomY,
    head: [['Tag','Datum','Objekt','Ausgeführte Arbeit','Zeit','Std.','Ansatz','Betrag CHF']],
    body: rows,
    foot: [['','','','','Total', totalHours.toFixed(2), '', totalBetrag>0 ? totalBetrag.toFixed(2) : '–']],
    styles: { fontSize: 8, cellPadding: 2.2, textColor: [30,40,55] },
    headStyles: { fillColor: [15,32,56], textColor: [255,255,255], fontStyle:'bold' },
    footStyles: { fillColor: [232,163,61], textColor: [15,32,56], fontStyle:'bold' },
    alternateRowStyles: { fillColor: [244,246,249] },
    columnStyles: {
      0:{cellWidth:9}, 1:{cellWidth:20}, 2:{cellWidth:30}, 3:{cellWidth:'auto'},
      4:{cellWidth:22}, 5:{cellWidth:13, halign:'right'}, 6:{cellWidth:16, halign:'right'}, 7:{cellWidth:20, halign:'right'}
    },
    margin: {left:14, right:14}
  });

  const finalY = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(8);
  doc.setTextColor(130,140,155);
  doc.text('Leitwärch Schläpfer · Rapport erstellt am ' + new Date().toLocaleDateString('de-CH'), 14, finalY);

  const filename = `Stundenrapport_${von}_bis_${bis}.pdf`;
  doc.save(filename);
  showToast('PDF erstellt');
}

  const monthFilter = document.getElementById('month-filter').value;

    rows = rows.filter(e=>objIds.includes(e.objektId));
  }
  if(objektFilter && objektFilter!=='all') rows = rows.filter(e=>e.objektId===objektFilter);
  rows.sort((a,b)=>a.date.localeCompare(b.date));

  let csv = 'Datum;Kunde;Objekt;Ausgeführte Arbeit;Von;Bis;Pause (Min);Stunden;Stundensatz;Betrag CHF\n';
  rows.forEach(e=>{
    const betrag = e.rate ? (e.hours*e.rate).toFixed(2) : '';
    csv += [e.date, entryKundeName(e.objektId), objektName(e.objektId), (e.arbeit||'').replace(/;/g,','), e.start, e.end, e.pause, e.hours.toFixed(2), e.rate||'', betrag].join(';') + '\n';
  });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Stundenrapport_LeitwaerchSchlaepfer.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exportiert');
}

loadAll();
</script>
</body>
</html>
